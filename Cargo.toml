[package]
name = "blockchain_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"          # Already used
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
tokio = { version = "1.0", features = ["full"] }
aes-gcm = "0.10"       # For AES-GCM encryption
sha3 = "0.10"          # For SHA3 hashing
rand = "0.8"           # For randomness
x25519-dalek = "2.0"   # For X25519 key exchange
hex = "0.4"            # For hex encoding